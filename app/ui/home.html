<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title data-i18n="title.home">Inicio</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <canvas class="wall"></canvas>
    <video class="wall" muted loop playsinline disablepictureinpicture></video>
    <img class="wall" alt="">
    <img class="hero" alt="">
    <img class="hero" alt="">
    <video class="trailer" muted loop playsinline disablepictureinpicture></video>
    <div class="scrim"></div>
    <img id="stage-cover" class="stage-cover" alt="">
    <div id="lyrics" class="lyrics"><div class="lines"></div></div>
  </div>
  <header class="topbar">
    <nav class="tabs">
      <span class="glyph">LB</span>
      <span class="tab" data-tab="games" data-i18n="tab.games">Juegos</span>
      <span class="tab" data-tab="apps" data-i18n="tab.apps">Apps</span>
      <span class="tab" data-tab="media" data-i18n="tab.media">Multimedia</span>
      <span class="tab" data-tab="settings" data-i18n="tab.settings">Ajustes</span>
      <span class="glyph">RB</span>
    </nav>
    <div class="topbar-end">
      <div id="volume-toast" class="volume volume-toast" hidden></div>
      <time id="clock"></time>
    </div>
  </header>
  <main id="view" class="view"></main>
  <aside id="quick" class="quick" hidden></aside>
  <div id="toast" class="toast" role="status" hidden><b></b> <span></span></div>
  <footer id="player" class="mini-player"></footer>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="backgrounds.js"></script>
  <script src="prefs.js"></script>
  <script src="previews.js"></script>
  <script src="home.js"></script>
</body>
</html>
