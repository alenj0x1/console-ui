[package]
name = "console-ui-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "console-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
padcore = { version = "0.1.0", path = "../crates/padcore" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }
