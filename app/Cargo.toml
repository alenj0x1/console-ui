[package]
name = "console-ui-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "console-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
padcore = { version = "0.1.0", path = "../crates/padcore" }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Media_Control", "Foundation", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_Xps", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
